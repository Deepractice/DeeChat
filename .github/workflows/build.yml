name: "🚀 DeeChat Build & Release"

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # ---------- macOS (x64 / Intel) ----------
  build-macos-x64:
    name: Build macOS x64
    runs-on: macos-13
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            app/renderer/package-lock.json

      - name: 📦 Install dependencies (workspace)
        run: |
          npm ci --prefer-offline
          cd app && npm ci --prefer-offline
          cd renderer && npm ci --prefer-offline

      - name: 📦 Install node-abi for ABI checking
        run: npm install -g node-abi

      - name: 🔍 Print Electron ABI
        run: node -e "console.log('Electron 30 | abi=' + require('node-abi').getAbi('30.0.0','electron'))"

      - name: 🔧 Rebuild native modules for Electron x64
        working-directory: app
        env:
          npm_config_runtime: electron
          npm_config_target: 30.0.0
          npm_config_disturl: https://electronjs.org/headers
          npm_config_arch: x64
        run: npx electron-rebuild -f -w lmdb --arch=x64

      - name: 🏗️ Build application
        run: npm run build

      - name: 🍎 Import Code-Signing Certificates
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
            security create-keychain -p "" build.keychain
            security import certificate.p12 -k ~/Library/Keychains/build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security list-keychains -s ~/Library/Keychains/build.keychain
            security default-keychain -s ~/Library/Keychains/build.keychain
            security unlock-keychain -p "" ~/Library/Keychains/build.keychain
            security set-key-partition-list -S apple-tool:,apple: -s -k "" ~/Library/Keychains/build.keychain
          fi

      - name: 📱 Build macOS x64 app
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --x64 --publish=never

      - name: 📤 Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-build
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/latest-mac.yml
          retention-days: 30

  # ---------- macOS (arm64 / Apple Silicon) ----------
  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            app/renderer/package-lock.json

      - name: 📦 Install dependencies (workspace)
        run: |
          npm ci --prefer-offline
          cd app && npm ci --prefer-offline
          cd renderer && npm ci --prefer-offline

      - name: 📦 Install node-abi for ABI checking
        run: npm install -g node-abi

      - name: 🔍 Print Electron ABI
        run: node -e "console.log('Electron 30 | abi=' + require('node-abi').getAbi('30.0.0','electron'))"

      - name: 🔧 Rebuild native modules for Electron arm64
        working-directory: app
        env:
          npm_config_runtime: electron
          npm_config_target: 30.0.0
          npm_config_disturl: https://electronjs.org/headers
          npm_config_arch: arm64
        run: npx electron-rebuild -f -w lmdb --arch=arm64

      - name: 🏗️ Build application
        run: npm run build

      - name: 🍎 Import Code-Signing Certificates
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
            security create-keychain -p "" build.keychain
            security import certificate.p12 -k ~/Library/Keychains/build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security list-keychains -s ~/Library/Keychains/build.keychain
            security default-keychain -s ~/Library/Keychains/build.keychain
            security unlock-keychain -p "" ~/Library/Keychains/build.keychain
            security set-key-partition-list -S apple-tool:,apple: -s -k "" ~/Library/Keychains/build.keychain
          fi

      - name: 📱 Build macOS arm64 app
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --arm64 --publish=never

      - name: 📤 Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-build
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/latest-mac.yml
          retention-days: 30

  # ---------- Windows (x64 only) ----------
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            app/renderer/package-lock.json

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 🔧 Force x64 + Electron headers for node-gyp
        shell: bash
        run: |
          echo "GYP_MSVS_VERSION=2022" >> $GITHUB_ENV
          echo "npm_config_arch=x64" >> $GITHUB_ENV
          echo "npm_config_target_arch=x64" >> $GITHUB_ENV
          echo "npm_config_runtime=electron" >> $GITHUB_ENV
          echo "npm_config_target=30.0.0" >> $GITHUB_ENV
          echo "npm_config_disturl=https://electronjs.org/headers" >> $GITHUB_ENV
          echo "npm_config_build_from_source=false" >> $GITHUB_ENV

      - name: 📦 Install dependencies (workspace)
        run: |
          npm ci --prefer-offline
          cd app && npm ci --prefer-offline
          cd renderer && npm ci --prefer-offline

      - name: 📦 Install node-abi for ABI checking
        run: npm install -g node-abi

      - name: 🔍 Print Electron ABI
        run: node -e "console.log('Electron 30 | abi=' + require('node-abi').getAbi('30.0.0','electron'))"

      - name: 🩹 Patch lmdb to disable V8 API (root & app)
        shell: pwsh
        run: |
          function Patch-Lmdb($base) {
            $paths = @(
              Join-Path $base "node_modules/lmdb/binding.gyp",
              Join-Path $base "node_modules/lmdb/binding.gypi"
            )
            foreach ($p in $paths) {
              if (Test-Path $p) {
                Write-Host "📝 Patching $p ..."
                $c = Get-Content $p -Raw
                $c = $c -replace '"ENABLE_V8_API=1"', '"ENABLE_V8_API=0"'
                $c = $c -replace "'ENABLE_V8_API=1'", "'ENABLE_V8_API=0'"
                Set-Content $p -Value $c
                Write-Host "✅ V8 API disabled in $p"
              }
            }
          }
          Write-Host "🔍 Patching LMDB in root directory..."
          Patch-Lmdb "$PWD"
          Write-Host "🔍 Patching LMDB in app directory..."
          Patch-Lmdb (Join-Path "$PWD" "app")

      - name: 🔧 Rebuild native modules for Electron (Windows x64)
        working-directory: app
        env:
          GYP_DEFINES: ENABLE_V8_API=0
        run: npx electron-rebuild -f -a x64 -w lmdb

      - name: 🏗️ Build application
        run: npm run build

      - name: 📱 Build Windows x64 app
        working-directory: app
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish=never

      - name: 📤 Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            app/release/*.exe
            app/release/latest.yml
          retention-days: 30

  # ---------- Linux (x64) ----------
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            app/renderer/package-lock.json

      - name: 🐧 Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3-dev libatk-bridge2.0-dev libdrm-dev libxkbcommon-dev \
            libxss1 libasound2-dev libgtk-3-dev

      - name: 📦 Install dependencies (workspace)
        run: |
          npm ci --prefer-offline
          cd app && npm ci --prefer-offline
          cd renderer && npm ci --prefer-offline

      - name: 📦 Install node-abi for ABI checking
        run: npm install -g node-abi

      - name: 🔍 Print Electron ABI
        run: node -e "console.log('Electron 30 | abi=' + require('node-abi').getAbi('30.0.0','electron'))"

      - name: 🔧 Rebuild native modules for Electron Linux (x64)
        working-directory: app
        env:
          npm_config_runtime: electron
          npm_config_target: 30.0.0
          npm_config_disturl: https://electronjs.org/headers
          npm_config_arch: x64
        run: npx electron-rebuild -f -w lmdb --arch=x64

      - name: 🏗️ Build application
        run: npm run build

      - name: 📱 Build Linux app
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --x64 --publish=never

      - name: 📤 Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            app/release/*.AppImage
            app/release/*.deb
            app/release/*.rpm
            app/release/latest-linux.yml
          retention-days: 30

  # ---------- Release (only on tag) ----------
  release:
    name: "🎉 Create Release"
    needs:
      - build-macos-x64
      - build-macos-arm64
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4

      - name: 📝 Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          files: |
            macos-x64-build/*.dmg
            macos-x64-build/*.zip
            macos-arm64-build/*.dmg
            macos-arm64-build/*.zip
            macos-x64-build/latest-mac.yml
            windows-build/*.exe
            windows-build/latest.yml
            linux-build/*.AppImage
            linux-build/*.deb
            linux-build/*.rpm
            linux-build/latest-linux.yml
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}